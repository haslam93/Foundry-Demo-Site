name: Daily Foundry intelligence

on:
  schedule:
    - cron: "23 6 * * *" # Daily at 06:23 UTC; GitHub schedules are best-effort.
  workflow_dispatch:

concurrency:
  group: foundry-source-refresh
  cancel-in-progress: false

permissions: {}

jobs:
  update-news:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Exercise offline adapter contracts
        run: python -m unittest discover -s tests -p 'test_update_news.py'

      - name: Refresh releases and watch documentation and samples
        id: refresh
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_news.py

      - name: Validate generated site data
        id: validate
        if: always()
        run: python scripts/validate_site.py

      - name: Commit changes
        id: publish
        if: always() && steps.validate.outcome == 'success' && steps.refresh.outcome != 'skipped'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- news.json resource-health.json feed.xml; then
            git add news.json resource-health.json feed.xml
            git commit -m "chore: refresh Foundry intelligence and source health" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi

      - name: Open or resolve the source-health alert
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          title="Foundry source refresh needs attention"
          issue=$(gh issue list --state open --limit 100 --search "\"$title\" in:title" \
            --json number,title,author \
            --jq '.[] | select(.title == "Foundry source refresh needs attention") | select(.author.login == "github-actions[bot]" or .author.login == "github-actions") | .number' | head -n 1)
          if [[ "$REFRESH_OUTCOME" != "success" || "$VALIDATE_OUTCOME" != "success" || "$PUBLISH_OUTCOME" != "success" ]]; then
            body="An automatic source refresh needs attention. Last-known good content is retained where possible; do not interpret a failed check as a product release. Inspect the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) and the site's Source Health section. Refresh: $REFRESH_OUTCOME. Validation: $VALIDATE_OUTCOME. Publication: $PUBLISH_OUTCOME. This issue is maintained by the refresh workflow and closes after recovery."
            if [[ -n "$issue" ]]; then
              gh issue edit "$issue" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          elif [[ -n "$issue" ]]; then
            gh issue close "$issue" --comment "All source checks and publication recovered in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          fi

      - name: Report source failures
        if: always() && steps.refresh.outcome != 'success'
        run: |
          echo "::error::The refresh was incomplete. Valid healthy-source updates and failure status are preserved; inspect the job summary."
          exit 1
