name: Validate and deploy field guide

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # GITHUB_TOKEN commits do not trigger ordinary push workflows. Explicitly
  # deploy the default branch after refresh, including partial-source failures.
  workflow_run:
    workflows: ["Daily Foundry intelligence"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: field-guide-pages-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Never execute a workflow_run artifact or an untrusted upstream ref.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned development dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test offline source adapters and Azure deployment contracts
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Test browser-independent frontend logic
        run: npm test
      - name: Validate and package public files only
        run: python scripts/build_site.py
      - name: Exercise desktop, mobile, theme, search, and mocked Azure flows
        run: npm run test:browser
      - name: Preserve browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
